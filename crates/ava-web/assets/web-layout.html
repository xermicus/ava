<script>
/* Keep the marked regions current without reloading, so forms keep their
 * state. The query is dropped from the address after the first swap, which
 * lets an action notice show once and then retire. */
const REFRESH_MILLISECONDS = 5000;

async function refresh() {
    const regions = document.querySelectorAll("[data-refresh]");
    if (regions.length === 0) {
        return;
    }

    const response = await fetch(location.pathname);
    if (!response.ok) {
        return;
    }
    const fresh = new DOMParser().parseFromString(await response.text(), "text/html");

    for (const region of regions) {
        const update = fresh.querySelector(`[data-refresh="${region.dataset.refresh}"]`);
        if (update) {
            region.replaceChildren(...update.childNodes);
        }
    }

    history.replaceState(null, "", location.pathname);
}

setInterval(() => refresh().catch(() => {}), REFRESH_MILLISECONDS);

/* Mark the section the page belongs to in the navigation. */
const SECTIONS = {
    "": "runs",
    run: "runs",
    scoreboard: "scoreboard",
    games: "games",
    tournaments: "tournaments",
    tournament: "tournaments",
    setup: "setup",
};
const active = document.querySelector(
    `nav a[data-page="${SECTIONS[location.pathname.split("/")[1]]}"]`,
);
if (active) {
    active.classList.remove("text-neutral-400");
    active.classList.add("bg-neutral-800", "text-neutral-100");
}
</script>
