upstream ava_score {
    server unix:/run/ava/score.sock;
}

server {
    listen unix:/run/ava/proxy.sock;
    server_name git;

    client_max_body_size 64m;

    location / {
        proxy_pass http://ava_score;
        # A push answers only after the receive hook scored it.
        proxy_read_timeout 180s;
    }
}

server {
    # Without default_server the first block on the socket, the scoring
    # server above, would answer every Host matching no server_name.
    listen unix:/run/ava/proxy.sock default_server;

    resolver 127.0.0.11 ipv6=off;

    client_max_body_size 0;

    if ($upstream = "") {
        return 403;
    }

    location / {
        js_header_filter ava.captureLimits;
        js_body_filter ava.captureResponse buffer_type=string;

        proxy_pass https://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_set_header Host $upstream;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 300s;
    }
}
