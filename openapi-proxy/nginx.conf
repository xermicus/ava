load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    js_import ava from /etc/nginx/ava.js;

    js_var $ava_response_tail "";
    js_var $ava_served_models "";
    js_var $ava_input_tokens "0";
    js_var $ava_output_tokens "0";
    js_var $ava_cache_read_tokens "0";
    js_var $ava_cache_write_tokens "0";
    js_var $ava_streamed_deltas "0";
    js_var $ava_first_byte_seconds "0";
    js_var $ava_first_token_seconds "0";
    js_var $ava_ratelimits "";

    log_format ava escape=json
        '{"time":"$time_iso8601"'
        ',"request_id":"$request_id"'
        ',"host":"$host"'
        ',"upstream":"$upstream"'
        ',"method":"$request_method"'
        ',"uri":"$uri"'
        ',"status":$status'
        ',"request_bytes":$request_length'
        ',"response_bytes":$bytes_sent'
        ',"upstream_bytes_sent":"$upstream_bytes_sent"'
        ',"upstream_bytes_received":"$upstream_bytes_received"'
        ',"request_seconds":$request_time'
        ',"connect_seconds":"$upstream_connect_time"'
        ',"header_seconds":"$upstream_header_time"'
        ',"upstream_seconds":"$upstream_response_time"'
        ',"first_byte_seconds":$ava_first_byte_seconds'
        ',"first_token_seconds":$ava_first_token_seconds'
        ',"served_models":"$ava_served_models"'
        ',"gateway_model":"$upstream_http_x_litellm_model_name"'
        ',"gateway_call_id":"$upstream_http_x_litellm_call_id"'
        ',"gateway_cost":"$upstream_http_x_litellm_response_cost_original"'
        ',"input_tokens":$ava_input_tokens'
        ',"output_tokens":$ava_output_tokens'
        ',"cache_read_tokens":$ava_cache_read_tokens'
        ',"cache_write_tokens":$ava_cache_write_tokens'
        ',"streamed_deltas":$ava_streamed_deltas'
        ',"ratelimits":"$ava_ratelimits"'
        '}';

    access_log  /var/log/nginx/access.log  ava;

    sendfile        on;

    # A sidecar serves one run, and a harness may idle longer than a minute
    # between requests. Closing an idle connection it still holds pooled would
    # fail its next request.
    keepalive_timeout  3600;

    include /etc/nginx/conf.d/*.conf;
}
